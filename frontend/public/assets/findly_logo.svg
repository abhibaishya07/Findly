<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E3A8A" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield/Hex -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="url(#primaryGrad)" filter="url(#shadow)" />
  
  <!-- Subtle Internal Grid/Tech Accent -->
  <circle cx="60" cy="60" r="42" stroke="white" stroke-opacity="0.1" stroke-width="1.5" stroke-dasharray="4 4" />
  
  <!-- Stylized F / Search Pin Emblem -->
  <!-- Location Radar Waves -->
  <path d="M60 22 C78 22 92 36 92 54" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  <path d="M60 30 C73 30 84 41 84 54" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  
  <!-- Central Pin & Finder Shape -->
  <path d="M60 36 C49.5 36 41 44.5 41 55 C41 68 57 84 60 87 C63 84 79 68 79 55 C79 44.5 70.5 36 60 36 Z" fill="white" />
  
  <!-- Modern Search Lens Center -->
  <circle cx="60" cy="54" r="10" fill="url(#primaryGrad)" />
  <circle cx="57" cy="51" r="3" fill="#38BDF8" />
  
  <!-- Handshake / Connectivity Arc -->
  <path d="M38 78 L50 90 M82 78 L70 90" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />
  <circle cx="60" cy="94" r="4" fill="#38BDF8" />
</svg>
